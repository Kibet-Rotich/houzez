name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- FRONTEND BUILD ---
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React App
        run: |
          cd Frontend/rental-frontend
          npm install
          npm run build

      # --- DEPLOY FRONTEND ---
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Frontend/rental-frontend/dist/ 
          server-dir: public_html/
          exclude: |
            .htaccess

      # --- DEPLOY BACKEND & RESTART ---
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: django_backend/
          # Ensure tmp/restart.txt is NOT excluded
          exclude: |
            **/venv/**
            **/__pycache__/**
            db.sqlite3
            media/